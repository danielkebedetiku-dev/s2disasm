name: Build Sonic 2 ROM
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Build ROM
        run: chmod -R +x build_tools && lua5.3 build.lua
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Friendship-Demake-ROM
          path: s2built.bin
